#cloud-config
# First-boot configuration for the "noob-orientation" CTF VM (Halcyon
# Protocol series). Native build -- no Docker. This file only
# establishes accounts, packages, and SSH policy; vm/scripts/
# remote-provision.sh (run over SSH) deploys the actual challenge.

hostname: noob-orientation
manage_etc_hosts: true

users:
  - name: ctfbuilder
    gecos: "CTF build/maintenance account (instructor-only, key-based)"
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKdkeCYqlhw6ffAJVjsY6IiGXJ9uiz0ZJUP6zw63aUZx ctf-instructor-build-key"

chpasswd:
  expire: false

ssh_pwauth: false
disable_root: true

package_update: true
package_upgrade: false
packages:
  - nginx-light
  - vsftpd
  - openssh-server
  - python3
  - sudo
  - zip
  - unzip
  - openssl
  - sshpass

runcmd:
  - [bash, -c, "echo 'cloud-init base config applied' > /var/log/ctf-cloudinit.log"]
